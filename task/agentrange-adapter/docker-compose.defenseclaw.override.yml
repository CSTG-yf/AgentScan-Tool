services:
  opspilot-app:
    environment:
      DEFENSECLAW_CONNECTOR: agentrange
      DEFENSECLAW_ADAPTER: external-sidecar
      LLM_BASE: http://defenseclaw-llm-proxy:8000/v1
      LANGFLOW_BASE: http://defenseclaw-langflow-ingress:7860
      MCP_CUSTOMER_DB: http://defenseclaw-mcp-proxy:8000/mcp-customer-db/mcp
      MCP_GITLAB: http://defenseclaw-mcp-proxy:8000/mcp-gitlab/mcp
      MCP_KNOWLEDGE: http://defenseclaw-mcp-proxy:8000/mcp-knowledge/mcp
      MCP_MONITORING: http://defenseclaw-mcp-proxy:8000/mcp-monitoring/mcp
      MCP_NOTES_SYNC: http://defenseclaw-mcp-proxy:8000/mcp-notes-sync/mcp
      MCP_SANDBOX_EXEC: http://defenseclaw-mcp-proxy:8000/mcp-sandbox-exec/mcp
      MCP_SHELL_RUNNER: http://defenseclaw-mcp-proxy:8000/mcp-shell-runner/mcp
      MCP_THREAT_INTEL: http://defenseclaw-mcp-proxy:8000/mcp-threat-intel/mcp
    ports: !reset []
  defenseclaw-opspilot-ingress:
    image: python:3.12-slim
    command: python /opt/defenseclaw/agentrange_sidecar.py
    env_file:
    - ../../.defenseclaw-home/.env
    volumes:
    - ../../cli/defenseclaw/agentrange_sidecar.py:/opt/defenseclaw/agentrange_sidecar.py:ro
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - egress-net
    - opspilot-net
    environment:
      PYTHONUNBUFFERED: '1'
      DC_GATEWAY_BASE: http://host.docker.internal:18970
      DC_FAIL_MODE: open
      DC_INSPECT_TIMEOUT_MS: '250'
      DC_CONNECTOR: agentrange
      DC_PROXY_KIND: opspilot
      DC_TARGET_BASE: http://opspilot-app:8000
      DC_LISTEN_PORT: '8000'
    depends_on:
    - opspilot-app
    ports:
    - 8100:8000
  defenseclaw-llm-proxy:
    image: python:3.12-slim
    command: python /opt/defenseclaw/agentrange_sidecar.py
    env_file:
    - ../../.defenseclaw-home/.env
    volumes:
    - ../../cli/defenseclaw/agentrange_sidecar.py:/opt/defenseclaw/agentrange_sidecar.py:ro
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - egress-net
    - opspilot-net
    environment:
      PYTHONUNBUFFERED: '1'
      DC_GATEWAY_BASE: http://host.docker.internal:18970
      DC_FAIL_MODE: open
      DC_INSPECT_TIMEOUT_MS: '250'
      DC_CONNECTOR: agentrange
      DC_PROXY_KIND: llm
      DC_TARGET_BASE: http://llm-stub:8000
      DC_LISTEN_PORT: '8000'
    depends_on:
    - llm-stub
  defenseclaw-mcp-proxy:
    image: python:3.12-slim
    command: python /opt/defenseclaw/agentrange_sidecar.py
    env_file:
    - ../../.defenseclaw-home/.env
    volumes:
    - ../../cli/defenseclaw/agentrange_sidecar.py:/opt/defenseclaw/agentrange_sidecar.py:ro
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - egress-net
    - opspilot-net
    environment:
      PYTHONUNBUFFERED: '1'
      DC_GATEWAY_BASE: http://host.docker.internal:18970
      DC_FAIL_MODE: open
      DC_INSPECT_TIMEOUT_MS: '250'
      DC_CONNECTOR: agentrange
      DC_PROXY_KIND: mcp
      DC_MCP_TARGETS: '{"mcp-customer-db": "http://mcp-customer-db:8000", "mcp-gitlab":
        "http://mcp-gitlab:8000", "mcp-knowledge": "http://mcp-knowledge:8000", "mcp-monitoring":
        "http://mcp-monitoring:8000", "mcp-notes-sync": "http://mcp-notes-sync:8000",
        "mcp-sandbox-exec": "http://mcp-sandbox-exec:8000", "mcp-shell-runner": "http://mcp-shell-runner:8000",
        "mcp-threat-intel": "http://mcp-threat-intel:8000"}'
      DC_LISTEN_PORT: '8000'
    depends_on:
    - mcp-customer-db
    - mcp-gitlab
    - mcp-knowledge
    - mcp-monitoring
    - mcp-notes-sync
    - mcp-sandbox-exec
    - mcp-shell-runner
    - mcp-threat-intel
  langflow:
    environment:
      OPENAI_API_BASE: http://defenseclaw-llm-proxy:8000/v1
    ports: !reset []
  defenseclaw-langflow-ingress:
    image: python:3.12-slim
    command: python /opt/defenseclaw/agentrange_sidecar.py
    env_file:
    - ../../.defenseclaw-home/.env
    volumes:
    - ../../cli/defenseclaw/agentrange_sidecar.py:/opt/defenseclaw/agentrange_sidecar.py:ro
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - egress-net
    - opspilot-net
    environment:
      PYTHONUNBUFFERED: '1'
      DC_GATEWAY_BASE: http://host.docker.internal:18970
      DC_FAIL_MODE: open
      DC_INSPECT_TIMEOUT_MS: '250'
      DC_CONNECTOR: agentrange
      DC_PROXY_KIND: langflow
      DC_TARGET_BASE: http://langflow:7860
      DC_LISTEN_PORT: '7860'
    depends_on:
    - langflow
    ports:
    - 7860:7860
x-defenseclaw-agentrange:
  non_invasive: true
  source_compose: ../AgentRange-player/docker-compose.yml
  gateway_base: http://host.docker.internal:18970
  routes:
  - kind: app
    from: host
    via: defenseclaw-opspilot-ingress
    to: opspilot-app
  - kind: llm
    from: opspilot-app
    via: defenseclaw-llm-proxy
    to: http://llm-stub:8000
  - kind: mcp
    env: MCP_CUSTOMER_DB
    from: opspilot-app
    via: defenseclaw-mcp-proxy
    to: mcp-customer-db
    path: /mcp
  - kind: mcp
    env: MCP_GITLAB
    from: opspilot-app
    via: defenseclaw-mcp-proxy
    to: mcp-gitlab
    path: /mcp
  - kind: mcp
    env: MCP_KNOWLEDGE
    from: opspilot-app
    via: defenseclaw-mcp-proxy
    to: mcp-knowledge
    path: /mcp
  - kind: mcp
    env: MCP_MONITORING
    from: opspilot-app
    via: defenseclaw-mcp-proxy
    to: mcp-monitoring
    path: /mcp
  - kind: mcp
    env: MCP_NOTES_SYNC
    from: opspilot-app
    via: defenseclaw-mcp-proxy
    to: mcp-notes-sync
    path: /mcp
  - kind: mcp
    env: MCP_SANDBOX_EXEC
    from: opspilot-app
    via: defenseclaw-mcp-proxy
    to: mcp-sandbox-exec
    path: /mcp
  - kind: mcp
    env: MCP_SHELL_RUNNER
    from: opspilot-app
    via: defenseclaw-mcp-proxy
    to: mcp-shell-runner
    path: /mcp
  - kind: mcp
    env: MCP_THREAT_INTEL
    from: opspilot-app
    via: defenseclaw-mcp-proxy
    to: mcp-threat-intel
    path: /mcp
  - kind: langflow
    from: host
    via: defenseclaw-langflow-ingress
    to: langflow
  event_model:
  - session_id
  - trace_id
  - stage
  - source
  - destination
  - actor
  - tenant
  - prompt
  - model
  - tool_name
  - mcp_server
  - request_body
  - response_body
  - decision
  - severity
  - reason
  - latency_ms
  - raw_ref
