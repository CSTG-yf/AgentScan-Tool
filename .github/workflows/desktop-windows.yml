name: Desktop Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - "cmd/defenseclaw/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/desktop-windows.yml"
  push:
    branches: [main, qjq]
    tags:
      - "tracebastion-desktop-v*"
    paths:
      - "desktop/**"
      - "cmd/defenseclaw/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/desktop-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Test Windows process inventory
        run: go test ./internal/inventory -run "TestNormalizeWindowsProcessName|TestProcessSnapshotWindowsIncludesCurrentProcess" -count=1

      - name: Test desktop host
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: Test process-guard enforcement
        shell: powershell
        run: .\desktop\scripts\test-process-guard.ps1

      - name: Build NSIS installer
        shell: powershell
        run: .\desktop\scripts\build.ps1 -SkipInstall

      - name: Smoke-test NSIS lifecycle
        shell: powershell
        run: .\desktop\scripts\test-installer.ps1 -InstallDir "$env:SystemDrive\TraceBastionDesktop-Custom-CI"

      - uses: actions/upload-artifact@v4
        with:
          name: TraceBastion-Desktop-Windows-x64
          path: dist/TraceBastion-Desktop-Setup-x64.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/tracebastion-desktop-v')
    needs: build
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TraceBastion-Desktop-Windows-x64
          path: dist

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            ".\dist\TraceBastion-Desktop-Setup-x64.exe#TraceBastion Desktop Setup (Windows x64)" `
            --repo "$env:GITHUB_REPOSITORY" `
            --verify-tag `
            --title "TraceBastion Desktop $($env:GITHUB_REF_NAME -replace '^tracebastion-desktop-', '')" `
            --generate-notes
