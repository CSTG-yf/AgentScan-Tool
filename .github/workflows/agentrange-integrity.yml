name: AgentRange full arena validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "task/AgentRange-player-full/**"
      - "task/agentrange-adapter/**"
      - "bench/**"
      - "integration/**"
      - "cli/defenseclaw/agentrange_*.py"
      - "policies/guardrail/**"
      - "test/agentrange_benchmark_test.py"
      - "test/test_agentrange_runtime.py"
      - "test/test_agentrange_static_inventory.py"
      - "internal/gateway/**"
      - "internal/watcher/**"
      - "internal/audit/actions.go"
      - ".github/workflows/agentrange-integrity.yml"
  push:
    branches: [main, qjq, "揭榜赛作品"]
    paths:
      - "task/AgentRange-player-full/**"
      - "task/agentrange-adapter/**"
      - "bench/**"
      - "integration/**"
      - "cli/defenseclaw/agentrange_*.py"
      - "policies/guardrail/**"
      - "test/agentrange_benchmark_test.py"
      - "test/test_agentrange_runtime.py"
      - "test/test_agentrange_static_inventory.py"
      - "internal/gateway/**"
      - "internal/watcher/**"
      - "internal/audit/actions.go"
      - ".github/workflows/agentrange-integrity.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test AgentRange scanner and benchmark contracts
        run: |
          python -m pip install -r task/AgentRange-player-full/requirements-dev.txt
          python -m pytest -q test/test_agentrange_static_inventory.py test/agentrange_benchmark_test.py test/test_agentrange_runtime.py
      - name: Test AgentRange guardrail rules
        run: go test ./internal/gateway -run '^TestAgentRangeRulePacksContainFrameworkExploitRules$' -count=1
      - name: Test protected fixture enforcement
        run: go test ./internal/watcher ./internal/audit
      - name: Build and verify full arena OpsPilot image
        run: |
          docker build -t agentrange-integrity-check -f task/AgentRange-player-full/opspilot-app/Dockerfile task/AgentRange-player-full
          docker run --rm --entrypoint python agentrange-integrity-check -c "from api.app import loaded_skill_message; assert 'meeting-summary' in loaded_skill_message('meeting-summary')['content']"
