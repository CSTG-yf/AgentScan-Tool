name: Desktop Linux

on:
  workflow_dispatch:
  pull_request:
    paths: ["desktop/**", "cmd/defenseclaw/**", "internal/**", "go.mod", "go.sum", ".github/workflows/desktop-linux.yml"]
  push:
    branches: [main, qjq]
    tags: ["tracebastion-desktop-v*"]
    paths: ["desktop/**", "cmd/defenseclaw/**", "internal/**", "go.mod", "go.sum", ".github/workflows/desktop-linux.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 fuse3
      - name: Test desktop host
        working-directory: desktop/src-tauri
        run: cargo test --locked
      - name: Build Linux setup packages
        run: bash desktop/scripts/linux/build.sh
      - name: Validate Debian package
        run: bash desktop/scripts/linux/test-installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TraceBastion-Desktop-Linux-x86_64
          path: dist/linux/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/tracebastion-desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TraceBastion-Desktop-Linux-x86_64
          path: dist/linux
      - name: Add Linux packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/linux/* --repo "$GITHUB_REPOSITORY" --clobber
