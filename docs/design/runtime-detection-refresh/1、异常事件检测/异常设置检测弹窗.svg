<svg xmlns="http://www.w3.org/2000/svg" width="1976" height="1248" viewBox="0 0 1976 1248">
  <defs>
    <style>
      .bg { fill: #f3f6fb; }
      .dim { fill: rgba(15, 23, 42, .48); }
      .sidebar { fill: #061421; }
      .sidebar-active { fill: #0f2f36; stroke: #27d3bd; stroke-width: 2; }
      .topbar { fill: #ffffff; stroke: #e6edf6; stroke-width: 1; }
      .card { fill: #ffffff; stroke: #e5ebf4; stroke-width: 1; }
      .modal { fill: #ffffff; stroke: #dce5f1; stroke-width: 1; }
      .soft { fill: #f8fafc; stroke: #e5ebf4; stroke-width: 1; }
      .soft-blue { fill: #eef6ff; stroke: #9ac7ff; stroke-width: 1.4; }
      .dark-btn { fill: #061b32; }
      .green-btn { fill: #19c7a5; }
      .line { stroke: #e8eef6; stroke-width: 1; }
      .muted { fill: #667085; font-family: Inter, "Microsoft YaHei", Arial, sans-serif; font-size: 15px; }
      .tiny { fill: #8a97a8; font-family: Inter, "Microsoft YaHei", Arial, sans-serif; font-size: 13px; }
      .body { fill: #253149; font-family: Inter, "Microsoft YaHei", Arial, sans-serif; font-size: 16px; }
      .strong { fill: #14213a; font-family: Inter, "Microsoft YaHei", Arial, sans-serif; font-size: 17px; font-weight: 700; }
      .title { fill: #14213a; font-family: Inter, "Microsoft YaHei", Arial, sans-serif; font-size: 28px; font-weight: 800; }
      .h2 { fill: #14213a; font-family: Inter, "Microsoft YaHei", Arial, sans-serif; font-size: 22px; font-weight: 800; }
      .h3 { fill: #14213a; font-family: Inter, "Microsoft YaHei", Arial, sans-serif; font-size: 19px; font-weight: 800; }
      .eyebrow { fill: #2678ff; font-family: Inter, "Microsoft YaHei", Arial, sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 4px; }
      .white { fill: #ffffff; font-family: Inter, "Microsoft YaHei", Arial, sans-serif; }
      .nav { fill: #8aa0b6; font-family: Inter, "Microsoft YaHei", Arial, sans-serif; font-size: 15px; font-weight: 600; }
      .nav-active { fill: #ffffff; font-family: Inter, "Microsoft YaHei", Arial, sans-serif; font-size: 15px; font-weight: 700; }
      .num { fill: #1677ff; font-family: Inter, "Microsoft YaHei", Arial, sans-serif; font-size: 42px; font-weight: 900; }
      .num-green { fill: #15a679; font-family: Inter, "Microsoft YaHei", Arial, sans-serif; font-size: 42px; font-weight: 900; }
      .num-orange { fill: #f97316; font-family: Inter, "Microsoft YaHei", Arial, sans-serif; font-size: 42px; font-weight: 900; }
      .chip { fill: #eef2f7; stroke: #dce5f1; stroke-width: 1; }
      .chip-blue { fill: #eaf3ff; stroke: #91caff; stroke-width: 1; }
      .chip-green { fill: #eafaf3; stroke: #8ce0ba; stroke-width: 1; }
      .chip-orange { fill: #fff7e6; stroke: #ffd591; stroke-width: 1; }
      .chip-red { fill: #fff1f0; stroke: #ffb3ac; stroke-width: 1; }
      .chip-text { fill: #334155; font-family: Inter, "Microsoft YaHei", Arial, sans-serif; font-size: 13px; font-weight: 700; }
      .chip-blue-text { fill: #0958d9; font-family: Inter, "Microsoft YaHei", Arial, sans-serif; font-size: 13px; font-weight: 800; }
      .chip-green-text { fill: #087c55; font-family: Inter, "Microsoft YaHei", Arial, sans-serif; font-size: 13px; font-weight: 800; }
      .chip-orange-text { fill: #ad4e00; font-family: Inter, "Microsoft YaHei", Arial, sans-serif; font-size: 13px; font-weight: 800; }
      .chip-red-text { fill: #c92a2a; font-family: Inter, "Microsoft YaHei", Arial, sans-serif; font-size: 13px; font-weight: 800; }
      .mono { fill: #334155; font-family: "JetBrains Mono", Consolas, monospace; font-size: 13px; }
      .table-head { fill: #fbfcfe; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity=".08" />
    </filter>
    <filter id="modalShadow" x="-12%" y="-12%" width="124%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#0f172a" flood-opacity=".18" />
    </filter>
  </defs>

  <rect class="bg" width="1976" height="1248" />
  <rect class="sidebar" x="0" y="0" width="238" height="1248" />
  <rect x="22" y="26" width="40" height="40" rx="10" fill="#51d5d0" />
  <path d="M42 36 L52 41 L50 55 L42 60 L34 55 L32 41 Z" fill="#06344a" />
  <text x="74" y="41" class="white" font-size="18" font-weight="800">TraceBastion</text>
  <text x="74" y="58" class="white" font-size="9" font-weight="700" opacity=".65">AGENT SECURITY CONTROL</text>
  <text x="74" y="70" class="white" font-size="9" font-weight="700" opacity=".65">PLANE</text>

  <g transform="translate(28,124)">
    <text class="nav" y="0">安全总览</text>
    <text class="nav" y="42">靶场控制</text>
    <rect class="sidebar-active" x="-12" y="72" width="196" height="40" rx="13" />
    <text class="nav-active" y="98">Agent 治理中心</text>
    <text class="nav" y="146">Agent 检测</text>
    <text class="nav" y="188">静态资源检测</text>
    <text class="nav" y="230">事件检测</text>
    <text class="nav" y="272">攻击链</text>
    <text class="nav" y="314">系统设置</text>
  </g>

  <rect class="topbar" x="238" y="0" width="1738" height="84" />
  <text x="270" y="31" class="eyebrow">WINDOWS 安全工作台</text>
  <text x="270" y="58" class="h3">异常检测设置</text>

  <g opacity=".45">
    <text x="270" y="164" class="eyebrow">ANOMALY DETECTION SETTINGS</text>
    <text x="270" y="210" class="title">异常检测设置</text>
    <rect class="card" x="270" y="250" width="395" height="116" rx="8" />
    <text x="294" y="286" class="muted">通用规则</text>
    <text x="294" y="336" class="num">12</text>
    <rect class="card" x="682" y="250" width="395" height="116" rx="8" />
    <text x="706" y="286" class="muted">已启用规则</text>
    <text x="706" y="336" class="num-green">10</text>
    <rect class="card" x="1094" y="250" width="395" height="116" rx="8" />
    <text x="1118" y="286" class="muted">AgentType 配置</text>
    <text x="1118" y="336" class="num-orange">7</text>
    <rect class="card" x="270" y="402" width="1631" height="356" rx="8" />
    <text x="294" y="444" class="h2">通用异常检测配置</text>
    <rect class="card" x="270" y="782" width="1631" height="360" rx="8" />
    <text x="294" y="824" class="h2">AgentType 专属配置列表</text>
  </g>
  <rect class="dim" x="238" y="84" width="1738" height="1164" />

  <g filter="url(#modalShadow)">
    <rect class="modal" x="378" y="118" width="1360" height="1030" rx="10" />
  </g>

  <g transform="translate(410,150)">
    <text class="title" y="0">CLI Agent 专属异常检测配置</text>
    <text class="muted" y="30">在通用规则基础上，为 CLI 类 Agent 配置专属检测、黑名单和风险判定方式。</text>
    <text x="1268" y="0" class="muted" font-size="26">×</text>

    <rect class="soft-blue" x="0" y="58" width="1296" height="92" rx="8" />
    <text x="22" y="92" class="strong">最终生效规则 = 通用异常检测规则 + AgentType 专属规则 + AgentType 黑名单</text>
    <text x="22" y="122" class="muted">关闭继承通用规则后，仅使用当前 AgentType 的专属规则和黑名单。风险判定可使用通用或自定义策略。</text>

    <g transform="translate(0,176)">
      <rect class="soft" width="414" height="92" rx="8" />
      <text x="20" y="34" class="strong">启用异常检测</text>
      <text x="20" y="60" class="tiny">关闭后该 AgentType 不产生新的异常检测。</text>
      <rect class="chip-green" x="326" y="30" width="62" height="28" rx="14" />
      <text class="chip-green-text" x="342" y="49">开启</text>

      <rect class="soft" x="440" width="414" height="92" rx="8" />
      <text x="460" y="34" class="strong">继承通用异常检测规则</text>
      <text x="460" y="60" class="tiny">默认在通用规则基础上增加专属配置。</text>
      <rect class="chip-green" x="766" y="30" width="62" height="28" rx="14" />
      <text class="chip-green-text" x="782" y="49">开启</text>

      <rect class="soft" x="880" width="416" height="92" rx="8" />
      <text x="900" y="34" class="strong">使用通用风险判定规则</text>
      <text x="900" y="60" class="tiny">关闭后下方可编辑 AgentType 自定义规则。</text>
      <rect class="chip-blue" x="1208" y="30" width="62" height="28" rx="14" />
      <text class="chip-blue-text" x="1224" y="49">关闭</text>
    </g>

    <g transform="translate(0,298)">
      <rect class="card" width="628" height="308" rx="8" />
      <text x="20" y="36" class="h2">① 专属异常检测规则</text>
      <rect class="green-btn" x="500" y="18" width="104" height="32" rx="10" />
      <text class="white" x="524" y="39" font-size="13" font-weight="800">新增规则</text>
      <line class="line" x1="20" y1="58" x2="608" y2="58" />
      <rect class="table-head" x="20" y="76" width="588" height="40" rx="6" />
      <text x="36" y="102" class="tiny">规则</text>
      <text x="250" y="102" class="tiny">严重级别</text>
      <text x="374" y="102" class="tiny">状态</text>
      <text x="500" y="102" class="tiny">操作</text>

      <line class="line" x1="20" y1="128" x2="608" y2="128" />
      <text x="36" y="156" class="strong">PowerShell Encoded Command</text>
      <text x="36" y="178" class="mono">dangerous_command</text>
      <rect class="chip-red" x="250" y="140" width="88" height="26" rx="8" />
      <text class="chip-red-text" x="266" y="158">CRITICAL</text>
      <rect class="chip-green" x="374" y="140" width="62" height="26" rx="8" />
      <text class="chip-green-text" x="390" y="158">启用</text>
      <text x="500" y="158" class="chip-blue-text">编辑</text>
      <text x="544" y="158" class="chip-red-text">删除</text>

      <line class="line" x1="20" y1="194" x2="608" y2="194" />
      <text x="36" y="222" class="strong">Shell Download And Execute</text>
      <text x="36" y="244" class="mono">exploit_behavior</text>
      <rect class="chip-orange" x="250" y="206" width="64" height="26" rx="8" />
      <text class="chip-orange-text" x="266" y="224">HIGH</text>
      <rect class="chip-green" x="374" y="206" width="62" height="26" rx="8" />
      <text class="chip-green-text" x="390" y="224">启用</text>
      <text x="500" y="224" class="chip-blue-text">编辑</text>
      <text x="544" y="224" class="chip-red-text">删除</text>
    </g>

    <g transform="translate(668,298)">
      <rect class="card" width="628" height="308" rx="8" />
      <text x="20" y="36" class="h2">② 黑名单</text>
      <rect class="green-btn" x="488" y="18" width="116" height="32" rx="10" />
      <text class="white" x="510" y="39" font-size="13" font-weight="800">新增黑名单</text>
      <line class="line" x1="20" y1="58" x2="608" y2="58" />
      <rect class="table-head" x="20" y="76" width="588" height="40" rx="6" />
      <text x="36" y="102" class="tiny">类型</text>
      <text x="138" y="102" class="tiny">匹配内容</text>
      <text x="390" y="102" class="tiny">风险</text>
      <text x="502" y="102" class="tiny">操作</text>

      <line class="line" x1="20" y1="128" x2="608" y2="128" />
      <rect class="chip-blue" x="36" y="140" width="82" height="26" rx="8" />
      <text class="chip-blue-text" x="58" y="158">command</text>
      <text x="138" y="156" class="mono">powershell -enc</text>
      <rect class="chip-red" x="390" y="140" width="88" height="26" rx="8" />
      <text class="chip-red-text" x="406" y="158">CRITICAL</text>
      <text x="502" y="158" class="chip-blue-text">编辑</text>
      <text x="546" y="158" class="chip-red-text">删除</text>

      <line class="line" x1="20" y1="194" x2="608" y2="194" />
      <rect class="chip-blue" x="36" y="206" width="68" height="26" rx="8" />
      <text class="chip-blue-text" x="56" y="224">domain</text>
      <text x="138" y="222" class="mono">pipedream.net</text>
      <rect class="chip-orange" x="390" y="206" width="64" height="26" rx="8" />
      <text class="chip-orange-text" x="406" y="224">HIGH</text>
      <text x="502" y="224" class="chip-blue-text">编辑</text>
      <text x="546" y="224" class="chip-red-text">删除</text>
    </g>

    <g transform="translate(0,632)">
      <rect class="card" width="862" height="284" rx="8" />
      <text x="20" y="36" class="h2">③ 风险判定方式</text>
      <rect class="chip-blue" x="702" y="18" width="124" height="30" rx="10" />
      <text class="chip-blue-text" x="724" y="38">自定义策略</text>
      <line class="line" x1="20" y1="58" x2="842" y2="58" />

      <rect class="soft" x="20" y="78" width="822" height="54" rx="8" />
      <circle cx="44" cy="105" r="8" fill="#ffffff" stroke="#98a2b3" stroke-width="2" />
      <text x="64" y="102" class="strong">使用通用风险判定规则</text>
      <text x="64" y="122" class="tiny">LOW → ALLOW、MEDIUM → ALERT、HIGH → ASK、CRITICAL → BLOCK</text>

      <rect class="soft-blue" x="20" y="144" width="822" height="106" rx="8" />
      <circle cx="44" cy="171" r="8" fill="#1677ff" stroke="#1677ff" stroke-width="2" />
      <circle cx="44" cy="171" r="3" fill="#ffffff" />
      <text x="64" y="168" class="strong">使用 AgentType 自定义风险判定规则</text>
      <text x="64" y="190" class="tiny">CLI Agent 风险阈值更敏感，高危更早进入 ASK/BLOCK。</text>
      <text x="64" y="224" class="mono">LOW 0.00-0.29 → ALLOW    MEDIUM 0.30-0.59 → ALERT</text>
      <text x="64" y="246" class="mono">HIGH 0.60-0.84 → ASK      CRITICAL 0.85-1.00 → BLOCK</text>
    </g>

    <g transform="translate(894,632)">
      <rect class="card" width="402" height="284" rx="8" />
      <text x="20" y="36" class="h2">有效配置预览</text>
      <line class="line" x1="20" y1="58" x2="382" y2="58" />
      <rect class="soft" x="20" y="78" width="362" height="48" rx="8" />
      <text x="40" y="108" class="muted">通用规则</text>
      <text x="320" y="108" class="strong">10</text>
      <rect class="soft" x="20" y="138" width="362" height="48" rx="8" />
      <text x="40" y="168" class="muted">专属规则</text>
      <text x="326" y="168" class="strong">3</text>
      <rect class="soft" x="20" y="198" width="362" height="48" rx="8" />
      <text x="40" y="228" class="muted">黑名单规则</text>
      <text x="326" y="228" class="strong">5</text>
    </g>

    <line class="line" x1="0" y1="954" x2="1296" y2="954" />
    <rect x="980" y="978" width="92" height="36" rx="10" fill="#ffffff" stroke="#d8e3f1" />
    <text x="1012" y="1001" class="body" font-size="14">取消</text>
    <rect class="dark-btn" x="1088" y="978" width="94" height="36" rx="10" />
    <text x="1118" y="1001" class="white" font-size="14" font-weight="800">保存</text>
    <rect class="green-btn" x="1198" y="978" width="98" height="36" rx="10" />
    <text x="1221" y="1001" class="white" font-size="14" font-weight="800">保存并重放</text>
  </g>
</svg>
