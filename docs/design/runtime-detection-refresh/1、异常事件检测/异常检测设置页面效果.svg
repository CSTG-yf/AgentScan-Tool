    <text x="750" y="94" class="tiny">状态</text>
    <text x="884" y="94" class="tiny">操作</text>

    <line class="line" x1="20" y1="122" x2="988" y2="122" />
    <text x="38" y="150" class="strong">Prompt Injection</text>
    <text x="276" y="150" class="mono">prompt_injection</text>
    <rect class="chip-red" x="476" y="132" width="68" height="26" rx="8" />
    <text class="chip-red-text" x="493" y="150">attack</text>
    <rect class="chip-orange" x="606" y="132" width="64" height="26" rx="8" />
    <text class="chip-orange-text" x="622" y="150">HIGH</text>
    <rect class="chip-green" x="750" y="132" width="62" height="26" rx="8" />
    <text class="chip-green-text" x="766" y="150">启用</text>
    <text x="884" y="150" class="chip-blue-text">编辑</text>
    <text x="928" y="150" class="chip-red-text">删除</text>

    <line class="line" x1="20" y1="174" x2="988" y2="174" />
    <text x="38" y="202" class="strong">Dangerous Command</text>
    <text x="276" y="202" class="mono">dangerous_command</text>
    <rect class="chip-red" x="476" y="184" width="68" height="26" rx="8" />
    <text class="chip-red-text" x="493" y="202">attack</text>
    <rect class="chip-red" x="606" y="184" width="88" height="26" rx="8" />
    <text class="chip-red-text" x="622" y="202">CRITICAL</text>
    <rect class="chip-green" x="750" y="184" width="62" height="26" rx="8" />
    <text class="chip-green-text" x="766" y="202">启用</text>
    <text x="884" y="202" class="chip-blue-text">编辑</text>
    <text x="928" y="202" class="chip-red-text">删除</text>

    <line class="line" x1="20" y1="226" x2="988" y2="226" />
    <text x="38" y="254" class="strong">Tool Abuse</text>
    <text x="276" y="254" class="mono">tool_abuse</text>
    <rect class="chip-orange" x="476" y="236" width="92" height="26" rx="8" />
    <text class="chip-orange-text" x="492" y="254">suspicious</text>
    <rect class="chip-orange" x="606" y="236" width="64" height="26" rx="8" />
    <text class="chip-orange-text" x="622" y="254">HIGH</text>
    <rect class="chip-green" x="750" y="236" width="62" height="26" rx="8" />
    <text class="chip-green-text" x="766" y="254">启用</text>
    <text x="884" y="254" class="chip-blue-text">编辑</text>
    <text x="928" y="254" class="chip-red-text">删除</text>

    <line class="line" x1="20" y1="278" x2="988" y2="278" />
    <text x="38" y="306" class="strong">Suspicious Process</text>
    <text x="276" y="306" class="mono">suspicious_process</text>
    <rect class="chip-orange" x="476" y="288" width="92" height="26" rx="8" />
    <text class="chip-orange-text" x="492" y="306">suspicious</text>
    <rect class="chip-blue" x="606" y="288" width="86" height="26" rx="8" />
    <text class="chip-blue-text" x="622" y="306">MEDIUM</text>
    <rect class="chip" x="750" y="288" width="62" height="26" rx="8" />
    <text class="chip-text" x="766" y="306">停用</text>
    <text x="884" y="306" class="chip-blue-text">编辑</text>
    <text x="928" y="306" class="chip-red-text">删除</text>
  </g>

  <g transform="translate(1322,454)">
    <rect class="soft" width="555" height="350" rx="8" />
    <text x="20" y="36" class="h3">通用风险判定规则</text>
    <rect class="chip" x="408" y="18" width="108" height="30" rx="10" />
    <text class="chip-text" x="432" y="38">只读展示</text>
    <text x="20" y="66" class="muted">默认分值区间与后端 runtime decision 映射。</text>

    <rect class="card" x="20" y="92" width="515" height="48" rx="8" />
    <rect class="chip-blue" x="38" y="103" width="82" height="26" rx="8" />
    <text class="chip-blue-text" x="64" y="121">LOW</text>
    <text x="148" y="122" class="mono">0.00 - 0.39</text>
    <rect class="chip-green" x="404" y="103" width="84" height="26" rx="8" />
    <text class="chip-green-text" x="424" y="121">ALLOW</text>

    <rect class="card" x="20" y="150" width="515" height="48" rx="8" />
    <rect class="chip-blue" x="38" y="161" width="98" height="26" rx="8" />
    <text class="chip-blue-text" x="58" y="179">MEDIUM</text>
    <text x="148" y="180" class="mono">0.40 - 0.69</text>
    <rect class="chip-orange" x="404" y="161" width="78" height="26" rx="8" />
    <text class="chip-orange-text" x="424" y="179">ALERT</text>

    <rect class="card" x="20" y="208" width="515" height="48" rx="8" />
    <rect class="chip-orange" x="38" y="219" width="82" height="26" rx="8" />
    <text class="chip-orange-text" x="62" y="237">HIGH</text>
    <text x="148" y="238" class="mono">0.70 - 0.89</text>
    <rect class="chip-orange" x="404" y="219" width="64" height="26" rx="8" />
    <text class="chip-orange-text" x="424" y="237">ASK</text>

    <rect class="card" x="20" y="266" width="515" height="48" rx="8" />
    <rect class="chip-red" x="38" y="277" width="98" height="26" rx="8" />
    <text class="chip-red-text" x="56" y="295">CRITICAL</text>
    <text x="148" y="296" class="mono">0.90 - 1.00</text>
    <rect class="chip-red" x="404" y="277" width="78" height="26" rx="8" />
    <text class="chip-red-text" x="424" y="295">BLOCK</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="270" y="862" width="1631" height="334" rx="8" />
  </g>
  <text x="294" y="904" class="h2">AgentType 专属配置列表</text>
  <text x="294" y="930" class="muted">在通用规则基础上，为不同类型 Agent 增加专属规则、黑名单或自定义风险判定。</text>
  <rect x="1512" y="884" width="220" height="34" rx="10" fill="#ffffff" stroke="#d9e1ee" />
  <text x="1534" y="906" class="tiny">搜索 AgentType</text>
