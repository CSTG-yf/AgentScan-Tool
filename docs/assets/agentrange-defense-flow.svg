<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent 工具调用防御过程</title>
  <desc id="desc">已认证主体的租户范围经会话传到 Gateway。Agent 的不可信输入和工具调用先由 Sidecar 截获；Gateway 依次执行授权边界、工具策略与通用行为规则。Action 模式的阻断在转发前返回 403，放行后才调用目标工具并检查响应。所有决策进入审计，Ground Truth 只参与离线评分。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#54706e"/></marker>
    <marker id="red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#b44843"/></marker>
    <marker id="green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#158064"/></marker>
  </defs>
  <style>
    text { font-family: "Microsoft YaHei UI", "Noto Sans CJK SC", sans-serif; letter-spacing: 0; }
    .small { font-size: 17px; fill: #506365; }
    .micro { font-size: 15px; fill: #5d7173; }
    .label { font-size: 15px; font-weight: 700; fill: #087c6d; }
    .box-title { font-size: 24px; font-weight: 700; fill: #203034; }
    .flow { stroke-dasharray: 8 7; animation: travel 1.4s linear infinite; }
    .step { animation: breathe 4s ease-in-out infinite; }
    .step-two { animation-delay: .8s; }
    .step-three { animation-delay: 1.6s; }
    @keyframes travel { to { stroke-dashoffset: -30; } }
    @keyframes breathe { 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { .flow, .step { animation: none; } }
  </style>
  <rect width="1200" height="780" fill="#f5f8f6"/>
  <rect x="1" y="1" width="1198" height="778" rx="7" fill="none" stroke="#d4dfda" stroke-width="2"/>
  <text x="48" y="65" font-size="34" font-weight="700" fill="#203034">AI Agent 工具调用防御过程</text>
  <text x="49" y="97" class="small">在线判断基于可信主体、当前流量和策略；危险动作在目标工具执行前被拒绝</text>

  <rect x="40" y="126" width="1120" height="111" rx="7" fill="#e7f0f5" stroke="#b9cfdb" stroke-width="2"/>
  <rect x="57" y="143" width="112" height="25" rx="3" fill="#3b6f95"/>
  <text x="113" y="161" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">可信控制面</text>
  <text x="57" y="199" font-size="21" font-weight="700" fill="#25475f">入口已验证 JWT / 主体</text>
  <text x="357" y="199" class="small">租户范围 + session + trace</text>
  <text x="741" y="190" class="micro">经上下文 relay 绑定检查请求</text>
  <path d="M742 237 V291" fill="none" stroke="#3b6f95" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="41" y="274" class="label">运行时数据面</text>
  <rect x="40" y="300" width="220" height="252" rx="6" fill="#fff" stroke="#cbd7d1" stroke-width="2"/>
  <rect x="40" y="300" width="220" height="7" fill="#96671c"/>
  <text x="60" y="345" class="box-title">Agent / LLM</text>
  <text x="60" y="380" class="small">接收用户与外部内容</text>
  <text x="60" y="416" class="small">形成工具调用</text>
  <rect x="59" y="444" width="181" height="76" rx="4" fill="#f7efe0"/>
  <text x="71" y="470" font-size="16" font-weight="700" fill="#765116">不可信输入</text>
  <text x="71" y="496" class="micro">提示词 / 网页 / Skill</text>

  <rect x="315" y="300" width="235" height="252" rx="6" fill="#fff" stroke="#b7d3ca" stroke-width="2"/>
  <rect x="315" y="300" width="235" height="7" fill="#087c6d"/>
  <text x="334" y="345" class="box-title">Sidecar 拦截</text>
  <text x="334" y="381" class="small">请求与工具调用先检查</text>
  <text x="334" y="416" class="small">LLM 工具调用也检查</text>
  <rect x="333" y="445" width="197" height="76" rx="4" fill="#e0f1ed"/>
  <text x="345" y="472" font-size="16" font-weight="700" fill="#075f55">前置检查点</text>
  <text x="345" y="498" class="micro">此时尚未转发到目标</text>

  <rect x="605" y="300" width="270" height="252" rx="6" fill="#fff" stroke="#a9c9c1" stroke-width="2"/>
  <rect x="605" y="300" width="270" height="7" fill="#087c6d"/>
  <text x="625" y="345" class="box-title">Gateway 决策</text>
  <circle cx="643" cy="381" r="14" fill="#e0f1ed"/><text x="643" y="387" text-anchor="middle" font-size="14" font-weight="700" fill="#075f55">1</text>
  <text x="670" y="387" class="small">租户授权边界</text>
  <circle cx="643" cy="425" r="14" fill="#e0f1ed"/><text x="643" y="431" text-anchor="middle" font-size="14" font-weight="700" fill="#075f55">2</text>
  <text x="670" y="431" class="small">显式工具策略</text>
  <circle cx="643" cy="469" r="14" fill="#e0f1ed"/><text x="643" y="475" text-anchor="middle" font-size="14" font-weight="700" fill="#075f55">3</text>
  <text x="670" y="475" class="small">通用行为规则</text>
  <text x="625" y="524" class="micro">输出动作、规则与证据</text>

  <path class="flow" d="M263 423 H305" fill="none" stroke="#54706e" stroke-width="4" marker-end="url(#arrow)"/>
  <path class="flow" d="M553 423 H595" fill="none" stroke="#54706e" stroke-width="4" marker-end="url(#arrow)"/>
  <circle class="step" cx="282" cy="423" r="5" fill="#087c6d"/>
  <circle class="step step-two" cx="572" cy="423" r="5" fill="#087c6d"/>

  <path class="flow" d="M878 390 H906 V371 H926" fill="none" stroke="#b44843" stroke-width="4" marker-end="url(#red-arrow)"/>
  <path class="flow" d="M878 456 H906 V486 H926" fill="none" stroke="#158064" stroke-width="4" marker-end="url(#green-arrow)"/>
  <rect x="935" y="300" width="225" height="123" rx="6" fill="#fbecea" stroke="#d69892" stroke-width="2"/>
  <text x="953" y="336" font-size="22" font-weight="700" fill="#a33832">BLOCK · action</text>
  <text x="953" y="369" class="small">返回 403，不转发</text>
  <text x="953" y="398" class="micro">危险副作用未发生</text>
  <rect x="935" y="442" width="225" height="110" rx="6" fill="#e6f3ee" stroke="#91c7b2" stroke-width="2"/>
  <text x="953" y="479" font-size="22" font-weight="700" fill="#116e56">ALLOW · 继续</text>
  <text x="953" y="511" class="small">转发工具 / 应用</text>
  <text x="953" y="536" class="micro">返回后再检查响应</text>

  <path d="M741 554 V614" fill="none" stroke="#54706e" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="40" y="625" width="1120" height="105" rx="6" fill="#273337"/>
  <text x="62" y="666" font-size="22" font-weight="700" fill="#fff">统一审计与离线 Benchmark</text>
  <text x="62" y="699" font-size="17" fill="#c7d9d3">记录 session / trace / 阶段 / 决策 / 规则 / 时延；Ground Truth 只在离线评分中使用</text>
  <text x="43" y="758" class="micro">说明：observe 模式只记录 would_block；响应阶段的阻断无法撤销先前已发生的副作用。虚线流动表示请求路径。</text>
</svg>
