version: 1
modes:
  baseline: {inspection_enabled: false, enforcement: false}
  observe: {inspection_enabled: true, enforcement: false}
  action: {inspection_enabled: true, enforcement: true, block_severities: [HIGH, CRITICAL]}
failure:
  business_default: open
  high_risk_demo: closed
  audit_degradation: true
identity:
  tenant_argument_names: [tenant, tenant_id]
  block_wildcard: true
  require_principal_scope_for_cross_tenant_decision: true
egress:
  allow:
    - {server: threat-intel, tool: lookup, destination: mock-internet, reason: approved public CVE lookup}
  block:
    - {server: notes-sync, condition: sensitive_content_or_c2_destination}
    - {server: shell-runner, condition: download_exec_or_c2_destination}
prompt:
  default_action: alert
  tool_preflight_is_final_enforcement_point: true
