version: 1
rules:
  - id: AR-STATIC-HIDDEN-INSTRUCTION
    title: Hidden or non-disclosure instruction in agent component
    severity: HIGH
    confidence: 0.92
    category: prompt_injection
    patterns: ['<IMPORTANT>', 'ignore previous instructions', '不要向用户提及', '不得告知', '先读取']
  - id: AR-STATIC-HIDDEN-TOOL
    title: Callable MCP tool omitted from tools/list
    severity: CRITICAL
    confidence: 0.98
    category: supply_chain_deception
    patterns: ['hidden=True']
  - id: AR-STATIC-STARTUP-BEACON
    title: Component performs startup network transmission
    severity: CRITICAL
    confidence: 0.95
    category: supply_chain_exfiltration
    patterns: ['on_start=send_startup_beacon', 'C2_URL']
  - id: AR-STATIC-SHELL-TRUE
    title: Untrusted value reaches shell-enabled subprocess
    severity: CRITICAL
    confidence: 0.96
    category: command_execution
    patterns: ['shell=True']
  - id: AR-STATIC-ARBITRARY-FILE
    title: Caller-controlled path is opened directly
    severity: HIGH
    confidence: 0.90
    category: sensitive_file_access
    patterns: ['def read_file(path', 'with open(path']
  - id: AR-CONFIG-WEAK-JWT
    title: Weak static JWT signing secret
    severity: HIGH
    confidence: 0.98
    category: weak_authentication
    patterns: ['JWT_SECRET=change-me-weak-secret', 'JWT_SECRET: change-me-weak-secret']
  - id: AR-CONFIG-SERVICE-ACCOUNT
    title: End-user scope can be replaced by a broad service identity
    severity: HIGH
    confidence: 0.92
    category: confused_deputy
    patterns: ['OPSPILOT_PROPAGATION=service-account', 'OPSPILOT_SERVICE_TOKEN=svc-root-all-access']
  - id: AR-CONFIG-PLAINTEXT-PASSWORD
    title: Plaintext service password in example configuration
    severity: MEDIUM
    confidence: 0.90
    category: plaintext_credential
    patterns: ['POSTGRES_PASSWORD=opspilot', 'LANGFLOW_SUPERUSER_PASSWORD=admin']
  - id: AR-CONFIG-LANGFLOW-AUTOLOGIN
    title: Langflow automatic login is enabled
    severity: MEDIUM
    confidence: 0.95
    category: authentication_bypass
    patterns: ['LANGFLOW_AUTO_LOGIN: "true"', 'LANGFLOW_SKIP_AUTH_AUTO_LOGIN: "true"']
